services:
  kafka:
    image: redpandadata/redpanda:v23.2.5
    container_name: kafka
    restart: unless-stopped
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --reserve-memory
      - 0M
      - --memory
      - "1G"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - kafka:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - kafka:33145
      - --set
      - log_segment_size=134217728
      - --set
      - log_retention_ms=3600000
      - --set
      - log_cleanup_policy=delete
      - --set
      - log_segment_delete_delay_ms=60000
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  connect:
    build:
      context: ./connect
      dockerfile: Dockerfile
    container_name: connect
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      REST_PORT: 8083
      LISTENERS: http://0.0.0.0:8083
      REST_ADVERTISED_HOST_NAME: connect
      REST_ADVERTISED_PORT: 8083
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONFIG_STORAGE_PARTITIONS: "1"
      OFFSET_STORAGE_PARTITIONS: "1"
      STATUS_STORAGE_PARTITIONS: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      PLUGIN_PATH: /kafka/connect,/etc/kafka-connect/jars
      LOG4J_LOGGERS: org.reflections=ERROR
      JMXPORT: 5555
      KAFKA_OPTS: -Xmx256m -Xms128m -javaagent:/kafka/libs/jolokia-jvm-1.7.1.jar=port=8778,host=0.0.0.0 -Djdbc.drivers=com.clickhouse.jdbc.ClickHouseDriver
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  console:
    image: redpandadata/console:latest
    container_name: console
    depends_on:
      - kafka
      - connect
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./console.yaml:/etc/console/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"


  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native TCP
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_USER: volume
      CLICKHOUSE_PASSWORD: msu&2GS%$*sf
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  connect-init:
    image: curlimages/curl:8.10.1
    container_name: connect-init
    depends_on:
      - connect
    volumes:
      - ./connectors:/connectors:ro
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 32m
    entrypoint: ["sh","-c"]
    command: >-
      '
      echo "Waiting for Kafka Connect...";
      for i in `seq 1 60`; do
        if curl -sf http://connect:8083/ >/dev/null; then echo "Connect is up"; break; fi;
        sleep 3;
      done;
      echo "Posting connectors";
      for f in /connectors/*.json; do
        case "$$f" in
          *.example.json) echo "Skipping example $$f";;
          *) echo "Applying $$f"; curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Content-Type: application/json" --data @"$$f" http://connect:8083/connectors || true;;
        esac;
      done;
      echo "Init complete, exiting"; exit 0'

volumes:
  kafka_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/kafka_data
  clickhouse_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/clickhouse_data
  clickhouse_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/clickhouse_logs

configs:
  clickhouse_config:
    content: |
      <clickhouse>
        <logger>
          <level>warning</level>
          <size>10M</size>
          <count>3</count>
        </logger>
        <max_server_memory_usage_to_ram_ratio>0.6</max_server_memory_usage_to_ram_ratio>
        <max_concurrent_queries>10</max_concurrent_queries>
        <background_pool_size>4</background_pool_size>
        <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
        <merge_tree>
          <parts_to_delay_insert>50</parts_to_delay_insert>
          <parts_to_throw_insert>100</parts_to_throw_insert>
          <max_parts_in_total>200</max_parts_in_total>
        </merge_tree>
      </clickhouse>

networks:
  default:
    name: postsql_default
    external: true
